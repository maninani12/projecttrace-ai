name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m ruff format --check .
        working-directory: backend
      - run: python -m pytest --cov=app --cov-report=term
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: projecttrace, POSTGRES_PASSWORD: ci-test-only, POSTGRES_DB: projecttrace}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U projecttrace" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://projecttrace:ci-test-only@localhost:5432/projecttrace
      REDIS_URL: redis://localhost:6379/0
      QUEUE_MODE: rq
      VECTOR_STORE: pgvector
      LLM_PROVIDER: offline
      APP_ENV: development
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r backend/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
        working-directory: backend
      - run: python -m app.workers.runner > /tmp/worker.log 2>&1 &
        working-directory: backend
      - run: npm run dev > /tmp/frontend.log 2>&1 &
        working-directory: frontend
      - run: python scripts/wait_ready.py
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-traces, path: frontend/test-results}
